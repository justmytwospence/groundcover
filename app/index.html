<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GroundCover — how much ground have you actually covered?</title>
    <meta
      name="description"
      content="Your Strava history counts every mile you log. This counts every mile of road and trail you have actually been on, the loop you run daily exactly once, and draws it. Runs entirely in your browser."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1b1f27" />

    <!-- No crawler should index someone's coverage map even if they share a link by accident. -->
    <meta name="robots" content="noindex" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="GroundCover" />
    <meta
      property="og:description"
      content="How much distinct ground have you actually covered? Counts the loop you have run two hundred times exactly once."
    />

    <!-- Inline so there is no favicon request and no external host to trust. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312141a'/%3E%3Cpath d='M6 22c4-1 5-9 9-9s5 8 11 5' stroke='%23eda100' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
